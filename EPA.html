<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Practice · v4.7 Vocabulary Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #64748b;
      --line: #d8e0ea;
      --panel: #ffffff;
      --paper: #f6f8fb;
      --brand: #0f766e;
      --brand-strong: #115e59;
      --accent: #f59e0b;
      --good: #15803d;
      --good-bg: #e9f8ee;
      --bad: #b91c1c;
      --bad-bg: #fff0f0;
      --focus: #2563eb;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eef7f5 0, rgba(238, 247, 245, 0) 300px),
        var(--paper);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.28);
      outline-offset: 2px;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      font-weight: 800;
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      background: #e6ecef;
      color: var(--ink);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--brand-strong);
    }

    .btn.warn {
      background: #fff4df;
      color: #8a4b00;
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
    }

    .icon {
      font-size: 18px;
      line-height: 1;
    }

    .lang-select {
      width: auto;
      min-width: 128px;
      min-height: 40px;
      padding: 0 34px 0 12px;
      font-weight: 800;
      background: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
      width: 100%;
    }

    .practice-page {
      display: grid;
      gap: 16px;
    }

    .practice-panel {
      width: 100%;
    }

    .admin-page {
      display: grid;
      width: 100%;
    }

    .admin-page .panel {
      width: 100%;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
      border-radius: 8px 8px 0 0;
    }

    .tab {
      flex: 1;
      min-height: 38px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }

    .tab.active {
      background: var(--brand);
      color: #fff;
    }

    .section {
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #334155;
      font-weight: 800;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      min-height: 42px;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.45;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .word-list {
      max-height: 430px;
      overflow: auto;
      border-top: 1px solid var(--line);
    }

    .word-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .word-main {
      min-width: 0;
    }

    .word-title {
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .word-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .delete {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .practice-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lesson-filter {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .lesson-title {
      margin: 0;
      color: #334155;
      font-weight: 800;
      font-size: 13px;
      text-align: right;
    }

    .lesson-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .lesson-chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .lesson-chip span {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
    }

    .lesson-chip input:checked + span {
      border-color: var(--brand);
      background: #ddf3ee;
      color: var(--brand-strong);
    }

    .practice-tools {
      display: grid;
      justify-items: end;
      gap: 10px;
      min-width: min(100%, 420px);
    }

    .count-control {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .count-control label {
      margin: 0;
    }

    .count-control input {
      width: 96px;
      min-height: 40px;
      font-weight: 800;
    }

    .chip {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      font-weight: 800;
    }

    .chip.active {
      border-color: var(--brand);
      background: #ddf3ee;
      color: var(--brand-strong);
    }

    .quiz {
      padding: 22px;
      min-height: 420px;
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .progress {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .question {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }

    .question-label {
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
    }

    .prompt {
      margin: 8px 0 0;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .meaning {
      margin-top: 8px;
      color: #334155;
      font-size: 16px;
    }

    .answer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .answer-row input {
      font-size: 22px;
      font-weight: 800;
      min-height: 54px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice {
      min-height: 58px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 900;
      font-size: 18px;
      color: var(--ink);
    }

    .choice:hover {
      border-color: var(--brand);
    }

    .feedback {
      display: none;
      border-radius: 8px;
      padding: 14px;
      font-weight: 800;
      line-height: 1.45;
    }

    .feedback.good {
      display: block;
      color: var(--good);
      background: var(--good-bg);
      border: 1px solid #bbf7d0;
    }

    .feedback.bad {
      display: block;
      color: var(--bad);
      background: var(--bad-bg);
      border: 1px solid #fecaca;
    }

    .answer-note {
      margin-top: 6px;
      font-weight: 600;
    }

    .empty {
      display: grid;
      min-height: 330px;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }

    .result {
      text-align: center;
      padding: 36px 18px;
    }

    .result h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .app {
        width: min(100% - 20px, 720px);
        padding-top: 12px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: stretch;
      }

      .header-actions .btn {
        flex: 1;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .practice-head {
        align-items: stretch;
        flex-direction: column;
      }

      .practice-tools {
        justify-items: stretch;
        min-width: 0;
      }

      .count-control {
        justify-content: flex-start;
      }

      .lesson-title {
        text-align: left;
      }

      .lesson-options {
        justify-content: flex-start;
      }
    }

    @media (max-width: 520px) {
      .mark {
        width: 40px;
        height: 40px;
      }

      h1 {
        font-size: 20px;
      }

      .grid-2,
      .choice-grid,
      .answer-row {
        grid-template-columns: 1fr;
      }

      .btn,
      .chip {
        min-height: 44px;
      }

      .quiz {
        padding: 14px;
      }

      .question {
        padding: 16px;
      }

      .prompt {
        font-size: 30px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 12px;
      }
    }
    .bank-selector { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .bank-option { display: inline-flex; gap: 6px; align-items: center; margin: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 44px; }
    .bank-option input { width: 20px; height: 20px; min-height: 0; accent-color: var(--brand); }
    .record-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .storage-note { padding: 12px 16px; margin-bottom: 16px; }
    .storage-warning { color: var(--bad); font-weight: 800; }
    #entryStatus { white-space: pre-wrap; }
    #exportScope { width: auto; max-width: 100%; }
    @media (max-width: 520px) {
      .word-row { grid-template-columns: 1fr; }
      .record-actions { justify-content: flex-start; }
      .header-actions .lang-select, #exportScope { flex: 1 1 100%; width: 100%; }
      .bank-option { flex: 1 1 100%; }
      .practice-tools, .practice-head > div { min-width: 0; }
    }
    .lesson-chip { position: relative; }
    .lesson-chip input { width: 1px; height: 1px; min-height: 0; margin: 0; padding: 0; clip-path: inset(50%); overflow: hidden; }
    .lesson-chip input:focus-visible + span { outline: 3px solid rgba(37, 99, 235, 0.4); outline-offset: 2px; }
  
    .vocab-controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:20px; }
    .vocab-controls label { margin:0; }
    .vocab-controls input { width:90px; }
    .vocab-picture { display:block; width:100%; max-width:320px; height:260px; object-fit:contain; margin:16px auto 24px; background:white; border-radius:12px; }
    #vocabPage { max-width:850px; margin:auto; }
    #vocabFeedback { min-height:60px; }
    #vocabPage button, #vocabPage input { min-height:48px; }
    #vocabPage .choice-grid { margin-bottom:20px; }
    #vocabPage .choice[disabled] { opacity:.75; }
    #vocabPage .choice.is-correct { border:2px solid #17834c; background:#e9f8ee; }
    #vocabPage .choice.is-wrong { border:2px solid #b42318; background:#fff0ee; }
    @media(max-width:520px) { .vocab-picture { height:220px; } .vocab-controls { align-items:stretch; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="mark">V</div>
        <div>
          <h1>English Practice</h1>
          <p class="subtitle" data-i18n="subtitle">小學生英文動詞溫習工具</p>
        </div>
      </div>
      <div class="header-actions">
        <select class="lang-select" id="languageSelect" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="btn primary" id="practiceNavBtn" type="button">Verb Practice</button>
        <button class="btn" id="vocabNavBtn" type="button">Vocabulary · 詞彙</button>
        <button class="btn" id="adminNavBtn" type="button" data-i18n="navAdmin">題庫輸入</button>
        <select id="exportScope" aria-label="Export scope">
          <option value="custom" data-i18n="exportCustom">Export: My bank</option>
          <option value="builtin" data-i18n="exportBuiltin">Export: Built-in</option>
          <option value="both" data-i18n="exportBoth">Export: Both</option>
        </select>
        <button class="btn" id="exportBtn" type="button"><span class="icon">↓</span><span data-i18n="export">匯出</span></button>
        <button class="btn warn" id="resetBtn" type="button"><span class="icon">↺</span><span data-i18n="reset">重設練習</span></button>
      </div>
    </header>

    <div class="panel storage-note"><p class="hint" id="storageStatus" role="status"></p><p class="hint" id="migrationStatus" role="status"></p></div>
    <section class="practice-page" id="practicePage">
      <section class="stats" aria-label="practice summary">
        <div class="stat"><strong id="totalWords">0</strong><span data-i18n="statWords">詞語</span></div>
        <div class="stat"><strong id="doneCount">0</strong><span data-i18n="statDone">已答</span></div>
        <div class="stat"><strong id="accuracy">0%</strong><span data-i18n="statAccuracy">答啱率</span></div>
        <div class="stat"><strong id="wrongCount">0</strong><span data-i18n="statWrong">錯題</span></div>
      </section>

      <section class="panel practice-panel">
        <div class="section">
          <div class="bank-selector">
            <h2 data-i18n="wordSource">練習題庫</h2>
            <div class="mode-row">
              <label class="bank-option"><input type="checkbox" id="sourceSeedInput" checked><span data-i18n="sourceSeed">內建題庫</span> (<strong id="builtinCount">0</strong>)</label>
              <label class="bank-option"><input type="checkbox" id="sourceFileInput"><span data-i18n="sourceFile">我的題庫</span> (<strong id="customCount">0</strong>)</label>
            </div>
            <p class="hint" id="sessionSource" aria-live="polite"></p>
          </div>
          <div class="practice-head">
            <div>
              <h2>Practice</h2>
              <p class="hint" data-i18n="practiceHint">混合練習會隨機問 past tense、-ing form、past participle。</p>
            </div>
            <div class="practice-tools">
              <div class="lesson-filter">
                <p class="lesson-title" data-i18n="lessonFilter">課堂</p>
                <div class="lesson-options" id="lessonOptions"></div>
              </div>
              <div class="count-control">
                <label for="questionCountInput" data-i18n="questionCount">題數</label>
                <input id="questionCountInput" type="number" min="1" max="50" value="10">
                <button class="btn" id="newQuizBtn" type="button" data-i18n="start">開始</button>
              </div>
              <div class="mode-row" aria-label="practice mode">
                <button class="chip active" data-mode="past" data-i18n="modePast" type="button">過去式</button>
                <button class="chip" data-mode="ing" data-i18n="modeIng" type="button">現在分詞</button>
                <button class="chip" data-mode="participle" data-i18n="modeParticiple" type="button">過去分詞</button>
                <button class="chip" data-mode="mixed" data-i18n="modeMixed" type="button">混合輸入</button>
                <button class="chip" data-mode="meaning" data-i18n="modeMeaning" type="button">中文意思</button>
                <button class="chip" data-mode="choice" data-i18n="modeChoice" type="button">混合選擇題</button>
              </div>
            </div>
          </div>
        </div>

        <div class="quiz" id="quizArea"></div>
      </section>
    </section>

    
    <section class="hidden" id="vocabPage" aria-label="Vocabulary practice">
      <div class="panel"><div class="section">
        <h2>Vocabulary · 詞彙</h2>
        <p class="hint">看圖練習 · 32 questions</p>
        <div class="vocab-controls">
          <button class="btn primary" id="vocabSelection" type="button" aria-pressed="true">Selection · 選擇</button>
          <button class="btn" id="vocabSpelling" type="button" aria-pressed="false">Spelling · 默寫</button>
          <label for="vocabCount">Questions · 題數</label>
          <input id="vocabCount" type="number" min="1" max="32" value="32" inputmode="numeric">
          <button class="btn" id="vocabStart" type="button">Start · 開始</button>
        </div>
        <div id="vocabQuiz" aria-live="polite"></div>
      </div></div>
    </section>
    <section class="admin-page hidden" id="adminPage">
      <div class="layout">
        <aside class="panel">
        <div class="toolbar" role="tablist" aria-label="管理工具">
          <button class="tab active" id="tabAdd" type="button" data-i18n="tabInput">輸入</button>
          <button class="tab" id="tabList" type="button" data-i18n="tabList">詞表</button>
        </div>

        <div class="section" id="addPane">
          <h2 data-i18n="addVerb">加入動詞</h2>
          <div class="panel" style="box-shadow:none; margin-bottom:16px">
            <div class="section" id="fileSourcePane">
              <input id="wordFileInput" type="file" accept=".json,.csv,.tsv,.txt,.html">
              <p class="hint" id="fileSourceStatus" data-i18n="fileSourceHint"></p>
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label for="lessonInput" data-i18n="lesson">課堂</label>
              <input id="lessonInput" placeholder="Lesson 1">
            </div>
            <div>
              <label for="baseInput" data-i18n="base">原形</label>
              <input id="baseInput" placeholder="go">
            </div>
            <div>
              <label for="pastInput" data-i18n="past">過去式</label>
              <input id="pastInput" placeholder="went">
            </div>
            <div>
              <label for="ingInput" data-i18n="ing">現在分詞</label>
              <input id="ingInput" placeholder="going">
            </div>
            <div>
              <label for="participleInput" data-i18n="participle">過去分詞</label>
              <input id="participleInput" placeholder="gone">
            </div>
            <div>
              <label for="meaningInput" data-i18n="meaning">中文意思</label>
              <input id="meaningInput" data-i18n-placeholder="meaningPlaceholder" placeholder="去">
            </div>
          </div>
          <label for="exampleInput" data-i18n="example">例句</label>
          <input id="exampleInput" placeholder="I go to school.">
          <div class="stack" style="margin-top:12px">
            <button class="btn primary" id="addBtn" type="button" data-i18n="addToList">＋ 加入詞表</button>
          </div>

          <button class="btn hidden" id="cancelEditBtn" type="button" data-i18n="cancelEdit">Cancel edit</button>

    els.tabAdd.addEventListener("click", () => setTab("add"));
    els.tabList.addEventListener("click", () => setTab("list"));
    document.querySelectorAll(".chip").forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        document.querySelectorAll(".chip").forEach((b) => b.classList.toggle("active", b === button));
        startSession();
      });
    });

    refreshWords();
    applyLanguage();
    saveState();
    applySourceUI();
    startSession();
    renderAll();

    function t(key, ...args) {
      const value = translations[language][key] ?? translations.zh[key] ?? key;
      return typeof value === "function" ? value(...args) : value;
    }

    function applyLanguage() {
      els.languageSelect.value = language;
      document.documentElement.lang = language === "en" ? "en" : "zh-Hant";
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });
    }

    function loadState() {
      let saved = null;
      const raw = safeStorage.getItem(bankKey);
      if (raw !== null) {
        try {
          saved = JSON.parse(raw);
          if (!saved || saved.version !== 1 || !Array.isArray(saved.customWords)) throw new Error("Unsupported saved bank");
        } catch (error) {
          saved = null; // Rejected data must not reach record/progress loading.
          persistenceBlocked = true;
          storageIssue = "Saved prototype data could not be read. It has not been overwritten. Export any new work before closing.";
        }
      }
      const customWords = [];
      const seen = new Set();
      let rejected = 0;
      const append = (rows) => {
        rows.forEach((row) => {
          const word = cleanWord(row);
          if (!validWord(word)) { rejected += 1; return; }
          const key = contentId(word);
          if (seen.has(key)) return;
          seen.add(key);
          word.source = "custom";
          word.uid = typeof row.uid === "string" && /^c:[a-zA-Z0-9_-]+$/.test(row.uid) && !customWords.some((w) => w.uid === row.uid) ? row.uid : newCustomId();
          customWords.push(word);
        });
      };
      let legacy = {};
      if (saved) {
        append(saved.customWords);
        if (rejected) {
          persistenceBlocked = true;
          storageIssue = "Some saved prototype records are invalid. Original storage is protected; export a backup before closing.";
        }
      } else if (!persistenceBlocked) {
        for (const key of [fileWordsKey, storeKey]) {
          const value = safeStorage.getItem(key);
          if (value === null) continue;
          try {
            const candidate = JSON.parse(value);
            if (key === storeKey && candidate && typeof candidate === "object" && !Array.isArray(candidate)) legacy = candidate;
            const rows = Array.isArray(candidate) ? candidate : candidate && candidate.words;
            if (Array.isArray(rows)) append(rows);
            else if (key === fileWordsKey) rejected += 1;
          } catch (error) { rejected += 1; }
        }
        if (customWords.length || rejected) migrationNotice = "Recovered " + customWords.length + " custom records from legacy storage; " + rejected + " unreadable records/payloads skipped. Legacy storage is unchanged.";
      }
      const progress = saved ? saved.progress || {} : legacy;
      const answered = Math.max(0, Math.floor(Number(progress.answered) || 0));
      const correct = Math.max(0, Math.min(answered, Math.floor(Number(progress.correct) || 0)));
      let sources = saved && saved.sources && typeof saved.sources.builtin === "boolean" && typeof saved.sources.custom === "boolean"
        ? { builtin: saved.sources.builtin, custom: saved.sources.custom }
        : { builtin: safeStorage.getItem(sourceKey) !== "file" || !customWords.length, custom: customWords.length > 0 };
      const all = [...builtInWords, ...customWords];
      const oldWrong = Array.isArray(progress.wrongIds) ? progress.wrongIds : [];
      let wrongIds = oldWrong.filter((id) => all.some((word) => wordId(word) === id));
      if (!saved) {
        const oldSource = safeStorage.getItem(sourceKey);
        const candidates = oldSource === "file" ? customWords : oldSource === "seed" ? builtInWords : all;
        wrongIds = candidates.filter((word) => oldWrong.includes(legacyId(word))).map(wordId);
        if (oldWrong.length) migrationNotice += " Legacy missed-word history mapped using its source where known; unmatched IDs omitted.";
      }
      return { customWords, sources, words: [], answered, correct, wrongIds: [...new Set(wrongIds)] };
    }

    function saveState() {
      if (!persistenceBlocked) safeStorage.setItem(bankKey, JSON.stringify({
        version: 1, customWords: state.customWords, sources: state.sources,
        progress: { answered: state.answered, correct: state.correct, wrongIds: state.wrongIds }
      }));
      renderStorageStatus();
    }

    function normalize(text) {
      return String(text || "").trim().toLowerCase();
    }

    function answerParts(text) {
      return String(text || "")
        .split(/\s*(?:\/|,|;|\bor\b)\s*/i)
        .map((part) => normalize(part))
        .filter(Boolean);
    }

    function answersMatch(answer, target, compositeChoice = false) {
      const targets = [...new Set(answerParts(target))];
      if (!targets.length) return false;
      if (!compositeChoice) return targets.includes(normalize(answer));
      const submitted = [...new Set(answerParts(answer))];
      return submitted.length === targets.length && submitted.every((part) => targets.includes(part));
    }

    function sameAnswer(left, right) {
      const leftParts = answerParts(left);
      const rightParts = answerParts(right);
      return leftParts.some((part) => rightParts.includes(part));
    }

    function wordId(word) { return word.uid || "b:" + contentId(word); }

    function contentId(word) {
      return JSON.stringify(["lesson", "base", "past", "ing", "participle", "meaning", "example"].map((key) => normalize(word[key])));
    }

    function legacyId(word) {
      return [word.lesson, word.base, word.past, word.ing, word.participle, word.meaning].map(normalize).join("|");
    }

    function newCustomId() {
      return "c:" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2) + "_" + Math.random().toString(36).slice(2);
    }

    function validWord(word) { return Boolean(word.base && word.past && word.ing && word.participle); }

    function refreshWords() {
      state.words = [...(state.sources.builtin ? builtInWords : []), ...(state.sources.custom ? state.customWords : [])];
    }

    function renderStorageStatus() {
      if (!els.storageStatus) return;
      els.storageStatus.textContent = storageIssue || t("storageHint");
      els.storageStatus.classList.toggle("storage-warning", Boolean(storageIssue));
      els.migrationStatus.textContent = migrationNotice;
    }

    function importSummary(result) {
      return t("importSummary", result.added, result.duplicates, result.rejected);
    }

    function cleanWord(word) {
      word = word && typeof word === "object" ? word : {};
      const base = String(word.base || "").trim();
      return {
        uid: word.uid || "", source: word.source || "",
        lesson: String(word.lesson || "General").trim() || "General", base,
        past: String(word.past || "").trim(),
        ing: String(word.ing || makeIng(base)).trim(),
        participle: String(word.participle || "").trim(),
        meaning: String(word.meaning || "").trim(),
        example: String(word.example || "").trim()
      };
    }

    function makeIng(base) {
      const word = String(base || "").trim().toLowerCase();
      if (!word) return "";
      if (word.endsWith("ie")) return word.slice(0, -2) + "ying";
      if (word.endsWith("e") && !word.endsWith("ee") && !word.endsWith("ye")) return word.slice(0, -1) + "ing";
      const shortVowels = "aeiou";
      const last = word[word.length - 1];
      const middle = word[word.length - 2];
      const first = word[word.length - 3];
      if (word.length >= 3 && !shortVowels.includes(last) && shortVowels.includes(middle) && !shortVowels.includes(first) && !["w", "x", "y"].includes(last)) {
        return word + last + "ing";
      }
      return word + "ing";
    }

    function addWords(words) {
      const existing = new Set(state.customWords.map(contentId));
      const result = { added: 0, duplicates: 0, rejected: 0 };
      words.forEach((row) => {
        const word = cleanWord(row);
        if (!validWord(word)) { result.rejected += 1; return; }
        const key = contentId(word);
        if (existing.has(key)) { result.duplicates += 1; return; }
        existing.add(key);
        word.uid = newCustomId();
        word.source = "custom";
        state.customWords.push(word);
        result.added += 1;
      });
      if (result.added) state.sources.custom = true;
      refreshWords();
      saveState();
      startSession();
      renderAll();
      return result;
    }

    function addSingleWord() {
      const row = cleanWord({
        lesson: els.lessonInput.value, base: els.baseInput.value, past: els.pastInput.value,
        ing: els.ingInput.value, participle: els.participleInput.value,
        meaning: els.meaningInput.value, example: els.exampleInput.value
      });
      if (editUid) {
        if (!validWord(row)) { els.entryStatus.textContent = t("requiredForms"); return; }
        if (state.customWords.some((word) => word.uid !== editUid && contentId(word) === contentId(row))) {
          els.entryStatus.textContent = t("duplicateEdit"); return;
        }
        const index = state.customWords.findIndex((word) => word.uid === editUid);
        if (index < 0) { cancelEdit(); return; }
        state.customWords[index] = { ...row, uid: editUid, source: "custom" };
        refreshWords(); saveState(); startSession(); renderAll();
        els.entryStatus.textContent = t("edited");
        cancelEdit();
      } else {
        const result = addWords([row]);
        els.entryStatus.textContent = importSummary(result);
        if (!result.added) return;
        clearForm();
      }
    }

    function clearForm() {
      [els.baseInput, els.pastInput, els.ingInput, els.participleInput, els.meaningInput, els.exampleInput].forEach((input) => input.value = "");
    }

    function cancelEdit() {
      editUid = null;
      clearForm();
      document.querySelector("#addBtn").textContent = t("addToList");
      document.querySelector("#cancelEditBtn").classList.add("hidden");
    }

    function editWord(uid) {
      const word = state.customWords.find((item) => item.uid === uid);
      if (!word) return;
      editUid = uid;
      ["lesson", "base", "past", "ing", "participle", "meaning", "example"].forEach((key) => els[key + "Input"].value = word[key]);
      setTab("add");
      document.querySelector("#addBtn").textContent = t("saveEdit");
      document.querySelector("#cancelEditBtn").classList.remove("hidden");
      els.baseInput.focus();
    }

    function deleteWord(uid) {
      const word = state.customWords.find((item) => item.uid === uid);
      if (!word || !confirm(t("deleteConfirm", word.base))) return;
      state.customWords = state.customWords.filter((item) => item.uid !== uid);
      state.wrongIds = state.wrongIds.filter((id) => id !== uid);
      if (editUid === uid) cancelEdit();
      refreshWords(); saveState(); startSession(); renderAll();
    }

    function importPastedWords() {
      try {
        const text = els.pasteInput.value;
        const words = parseDelimitedWords(text, text.includes("\t") ? "\t" : ",");
        const result = addWords(words);
        els.entryStatus.textContent = importSummary(result);
        if (result.added && !result.rejected) els.pasteInput.value = "";
      } catch (error) { els.entryStatus.textContent = t("fileSourceError"); }
    }

    function exportWords() {
      const words = getExportWords();
      if (!words.length) { alert(t("nothingExport")); return; }
      const blob = new Blob(["\uFEFF" + csvForWords(words)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "verb-practice-" + els.exportScope.value + ".csv";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function getExportWords() {
      return els.exportScope.value === "builtin" ? builtInWords
        : els.exportScope.value === "both" ? [...builtInWords, ...state.customWords] : state.customWords;
    }

    function csvForWords(words) {
      const header = ["lesson", "base", "past", "ing", "participle", "meaning", "example"];
      return [header.join(","), ...words.map((word) => header.map((key) => '"' + String(word[key] || "").replace(/"/g, '""') + '"').join(","))].join("\r\n");
    }

    function resetPractice() {
      state.answered = 0;
      state.correct = 0;
      state.wrongIds = [];
      saveState();
      startSession();
      renderAll();
    }

    function applySourceUI() {
      els.sourceSeedInput.checked = state.sources.builtin;
      els.sourceFileInput.checked = state.sources.custom;
      els.builtinCount.textContent = builtInWords.length;
      els.customCount.textContent = state.customWords.length;
      renderStorageStatus();
    }

    function setWordSource() {
      state.sources = { builtin: els.sourceSeedInput.checked, custom: els.sourceFileInput.checked };
      selectedLessons = ["__all"];
      refreshWords(); saveState(); startSession(); renderAll();
    }

    function applyWordBank(words) {
      if (!Array.isArray(words)) throw new Error("Expected an array of records");
      return addWords(words);
    }

    function loadWordFile() {
      const file = els.wordFileInput.files && els.wordFileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const result = applyWordBank(parseWordFile(String(reader.result || ""), file.name));
          els.fileSourceStatus.textContent = importSummary(result);
        } catch (error) {
          els.fileSourceStatus.textContent = t("fileSourceError");
        } finally { els.wordFileInput.value = ""; }
      };
      reader.onerror = () => { els.fileSourceStatus.textContent = t("fileSourceError"); };
      reader.readAsText(file);
    }

    function parseWordFile(text, fileName = "") {
      if (!text.trim()) return [];
      const trimmed = text.trim().replace(/^\uFEFF/, "");
      if (/^[\[{]/.test(trimmed)) {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) return parsed;
        if (parsed && Array.isArray(parsed.words)) return parsed.words;
        throw new Error("JSON must be an array or an object with words");
      }
      if (/\.html?$/i.test(fileName) || /^<!doctype|^<html/i.test(trimmed)) {
        const seedMatch = text.match(/const\s+seedWords\s*=\s*(\[[\s\S]*?\]);/);
        if (!seedMatch) throw new Error("No seedWords array found");
        // Parse the historical literal format as data; never evaluate imported JavaScript.
        const json = seedMatch[1]
          .replace(/^\s*\/\/.*$/gm, "")
          .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
          .replace(/,\s*([}\]])/g, "$1");
        return JSON.parse(json);
      }
      return parseDelimitedWords(text, /\.csv$/i.test(fileName) ? "," : "\t");
    }

    function parseDelimitedWords(text, delimiter) {
      const parsedRows = parseDelimitedTable(String(text).replace(/^\uFEFF/, ""), delimiter);
      if (!parsedRows.length) return [];
      const keys = ["lesson", "base", "past", "ing", "participle", "meaning", "example"];
      const first = parsedRows[0].map(normalize);
      const hasHeader = first.includes("base") && first.includes("past") && first.includes("participle");
      return (hasHeader ? parsedRows.slice(1) : parsedRows).map((parts) => {
        if (hasHeader) return Object.fromEntries(keys.map((key) => [key, first.includes(key) ? parts[first.indexOf(key)] || "" : ""]));
        if (parts.length >= 7) return { lesson: parts[0], base: parts[1], past: parts[2], ing: parts[3], participle: parts[4], meaning: parts[5], example: parts.slice(6).join(" ") };
        if (parts.length >= 6) return { lesson: "General", base: parts[0], past: parts[1], ing: parts[2], participle: parts[3], meaning: parts[4], example: parts.slice(5).join(" ") };
        return { lesson: "General", base: parts[0], past: parts[1], ing: "", participle: parts[2], meaning: parts[3], example: parts.slice(4).join(" ") };
      });
    }

    function parseDelimitedTable(text, delimiter) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      const finishRow = () => {
        row.push(cell.trim()); cell = "";
        if (row.some((value) => value)) rows.push(row);
        row = [];
      };
      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        if (ch === '"') {
          if (quoted && text[i + 1] === '"') { cell += '"'; i += 1; }
          else if (quoted || !cell.trim()) quoted = !quoted;
          else cell += ch;
        } else if (ch === delimiter && !quoted) { row.push(cell.trim()); cell = ""; }
        else if ((ch === "\n" || ch === "\r") && !quoted) {
          if (ch === "\r" && text[i + 1] === "\n") i += 1;
          finishRow();
        } else cell += ch;
      }
      if (quoted) throw new Error("Unclosed quote");
      finishRow();
      return rows;
    }

    function splitDelimitedRow(row, delimiter) {
      const cells = [];
      let cell = "";
      let quoted = false;
      for (let index = 0; index < row.length; index += 1) {
        const char = row[index];
        if (char === '"') {
          if (quoted && row[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (char === delimiter && !quoted) {
          cells.push(cell.trim());
          cell = "";
        } else {
          cell += char;
        }
      }
      cells.push(cell.trim());
      return cells;
    }

    function getLessons() {
      return [...new Set(state.words.map((word) => cleanWord(word).lesson).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    }

    function getFilteredWords() {
      if (selectedLessons.includes("__all")) return state.words;
      const selected = new Set(selectedLessons);
      return state.words.filter((word) => selected.has(cleanWord(word).lesson));
    }

    function renderLessonOptions() {
      const lessons = getLessons();
      const valid = new Set(lessons);
      selectedLessons = selectedLessons.filter((lesson) => lesson === "__all" || valid.has(lesson));
      if (!selectedLessons.length) selectedLessons = ["__all"];
      els.lessonOptions.innerHTML = [
        lessonChip("__all", t("allLessons"), selectedLessons.includes("__all")),
        ...lessons.map((lesson) => lessonChip(lesson, lesson, selectedLessons.includes(lesson)))
      ].join("");
      els.lessonOptions.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.value === "__all") {
            selectedLessons = ["__all"];
          } else {
            selectedLessons = [...els.lessonOptions.querySelectorAll("input:checked")]
              .map((item) => item.value)
              .filter((value) => value !== "__all");
            if (!selectedLessons.length) selectedLessons = ["__all"];
          }
          renderLessonOptions();
          startSession();
        });
      });
    }

    function lessonChip(value, label, checked) {
      return `
        <label class="lesson-chip">
          <input type="checkbox" value="${escapeAttribute(value)}" ${checked ? "checked" : ""}>
          <span>${escapeHtml(label)}</span>
        </label>
      `;
    }

    function reloadBuiltInWords() {
      state.sources.builtin = true;
      refreshWords(); saveState(); startSession(); renderAll(); showPracticePage();
    }

    function showPracticePage() {
      leaveVocabulary();
      els.practicePage.classList.remove("hidden");
      els.adminPage.classList.add("hidden");
      els.practiceNavBtn.classList.add("primary");
      els.adminNavBtn.classList.remove("primary");
    }

    function requestAdminPage() {
      const password = prompt(t("passwordPrompt"));
      if (password !== ADMIN_PASSWORD) {
        if (password !== null) alert(t("passwordWrong"));
        return;
      }
      leaveVocabulary();
      els.practicePage.classList.add("hidden");
      els.adminPage.classList.remove("hidden");
      els.practiceNavBtn.classList.remove("primary");
      els.adminNavBtn.classList.add("primary");
      setTab("add");
    }

    function setTab(tab) {
      const isAdd = tab === "add";
      els.tabAdd.classList.toggle("active", isAdd);
      els.tabList.classList.toggle("active", !isAdd);
      els.addPane.classList.toggle("hidden", !isAdd);
      els.listPane.classList.toggle("hidden", isAdd);
      els.wordList.classList.toggle("hidden", isAdd);
    }

    function startSession(useWrongOnly = false) {
      if (advanceTimer !== null) clearTimeout(advanceTimer);
      advanceTimer = null;
      sessionGeneration += 1;
      refreshWords();
      const filteredWords = getFilteredWords();
      const eligible = filteredWords.filter((word) => mode !== "meaning" || answerParts(word.meaning).length > 0);
      const source = useWrongOnly ? eligible.filter((word) => state.wrongIds.includes(wordId(word))) : eligible;
      const count = getQuestionCount();
      els.questionCountInput.value = count;
      session = shuffle(source).slice(0, count);
      sessionForms = session.map(() => ["past", "ing", "participle"][Math.floor(Math.random() * 3)]);
      currentIndex = 0; locked = false;
      sessionAnswered = 0; sessionCorrect = 0;
      sessionWrongOnly = useWrongOnly;
      renderQuiz(); renderStats(); renderLessonOptions(); applySourceUI();
      renderAvailability();
    }

    function renderAvailability() {
      const filtered = getFilteredWords();
      const eligible = filtered.filter((word) => mode !== "meaning" || answerParts(word.meaning).length > 0).length;
      const labels = [state.sources.builtin && t("sourceSeed"), state.sources.custom && t("sourceFile")].filter(Boolean);
      els.sessionSource.textContent = t("availableSummary", labels.join(" + ") || t("noSources"), eligible, filtered.length);
      if (mode === "meaning" && eligible < filtered.length) els.sessionSource.textContent += " " + t("meaningSkipped", filtered.length - eligible);
      if (eligible < getQuestionCount()) els.sessionSource.textContent += " " + t("limitedCount", Math.min(eligible, getQuestionCount()));
    }

    function getQuestionCount() {
      const value = Number(els.questionCountInput.value);
      const safeValue = Number.isFinite(value) ? Math.round(value) : 10;
      return Math.max(1, Math.min(50, safeValue));
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function renderAll() {
      refreshWords(); renderStats(); renderLessonOptions(); renderList(); renderQuiz(); applySourceUI(); renderAvailability();
    }

    function renderStats() {
      const wrongCount = state.wrongIds.length;
      const accuracy = state.answered ? Math.round((state.correct / state.answered) * 100) : 0;
      els.totalWords.textContent = state.words.length;
      els.doneCount.textContent = state.answered;
      els.accuracy.textContent = `${accuracy}%`;
      els.wrongCount.textContent = wrongCount;
    }

    function renderList() {
      const words = [...builtInWords, ...state.customWords];
      els.wordList.innerHTML = words.map((word) => `
        <div class="word-row">
          <div class="word-main">
            <div class="word-title">${escapeHtml(word.base)} → ${escapeHtml(word.past)} · ${escapeHtml(word.ing)} · ${escapeHtml(word.participle)}</div>
            <div class="word-meta"><strong>${escapeHtml(t(word.source === "custom" ? "sourceFile" : "sourceSeed"))}</strong> · ${escapeHtml(word.lesson)} · ${escapeHtml(word.meaning)}${word.example ? " · " + escapeHtml(word.example) : ""}${!word.meaning && !word.example ? " · " + escapeHtml(t("noContext")) : ""}</div>
          </div>
          <div class="record-actions">${word.source === "custom" ? `
            <button class="btn" type="button" data-edit="${escapeAttribute(word.uid)}">${escapeHtml(t("edit"))}</button>
            <button class="btn warn" type="button" data-delete="${escapeAttribute(word.uid)}">${escapeHtml(t("delete"))}</button>
          ` : `<span class="hint">${escapeHtml(t("readOnly"))}</span>`}</div>
        </div>`).join("");
      els.wordList.querySelectorAll("[data-edit]").forEach((button) => button.addEventListener("click", () => editWord(button.dataset.edit)));
      els.wordList.querySelectorAll("[data-delete]").forEach((button) => button.addEventListener("click", () => deleteWord(button.dataset.delete)));
    }

    function renderQuiz() {
      if (!els.quizArea) return;
      if (!state.words.length) {
        els.quizArea.innerHTML = '<div class="empty">' + escapeHtml(!state.sources.builtin && !state.sources.custom ? t("noSources") : t("emptyQuiz")) + '</div>';
        return;
      }
      if (!session.length) {
        els.quizArea.innerHTML = '<div class="empty">' + escapeHtml(sessionWrongOnly ? t("noRetry") : !getFilteredWords().length ? t("emptyLesson") : mode === "meaning" ? t("noEligible") : t("emptyQuiz")) + '</div>';
        return;
      }
      if (currentIndex >= session.length) {
        renderResult();
        return;
      }

      const word = session[currentIndex];
      const form = getQuestionForm();
      const target = getTarget(word, form);
      const progress = Math.round((currentIndex / session.length) * 100);
      const choiceHtml = mode === "choice" ? renderChoices(word, target, form) : "";
      const inputHtml = mode === "choice" ? "" : `
        <div class="answer-row">
          <input id="answerInput" autocomplete="off" placeholder="${escapeAttribute(t("answerPlaceholder"))}">
          <button class="btn primary" id="checkBtn" type="button">${escapeHtml(t("check"))}</button>
        </div>
      `;

      els.quizArea.innerHTML = `
        <div class="progress" aria-label="progress"><span style="width:${progress}%"></span></div>
        <div class="question">
          <div class="question-label">${escapeHtml(t("questionLabel", currentIndex + 1, session.length))}</div>
          <div class="prompt">${escapeHtml(getPrompt(word, form))}</div>
          <div class="hint">${escapeHtml(t(word.source === "custom" ? "sourceFile" : "sourceSeed"))} · ${escapeHtml(word.lesson)}</div>
          <div class="meaning">${escapeHtml(getHelperText(word))}</div>
        </div>
        ${inputHtml}
        ${choiceHtml}
        <div class="feedback" id="feedback"></div>
      `;

      const input = document.querySelector("#answerInput");
      const checkBtn = document.querySelector("#checkBtn");
      if (input && checkBtn) {
        input.focus();
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") checkAnswer(input.value, target);
        });
        checkBtn.addEventListener("click", () => checkAnswer(input.value, target));
      }
      document.querySelectorAll("[data-choice]").forEach((button) => {
        button.addEventListener("click", () => checkAnswer(button.dataset.choice, target));
      });
    }

    function getQuestionForm() {
      if (mode !== "choice" && mode !== "mixed") return mode;
      return sessionForms[currentIndex] || "past";
    }

    function getTarget(word, form = mode) {
      if (form === "ing") return word.ing;
      if (form === "participle") return word.participle;
      if (mode === "meaning") return word.meaning;
      return word.past;
    }

    function getPrompt(word, form = mode) {
      if (mode === "meaning") return word.base;
      if (form === "ing") return `-ing form of ${word.base}`;
      if (form === "participle") return `past participle of ${word.base}`;
      return `past tense of ${word.base}`;
    }

    function getHelperText(word) {
      if (mode === "meaning") return word.example || t("meaningHelp");
      return `${word.meaning}${word.example ? " · " + word.example : ""}`;
    }

    function renderChoices(word, target, form) {
      const candidates = shuffle(getFilteredWords().filter((item) => item !== word).map((item) => getTarget(item, form)));
      const distractors = [];
      candidates.forEach((option) => {
        if (option && !sameAnswer(option, target) && !distractors.some((existing) => sameAnswer(existing, option))) {
          distractors.push(option);
        }
      });
      const shuffledOptions = shuffle([target, ...distractors.slice(0, 3)]);
      return `
        <div class="choice-grid">
          ${shuffledOptions.map((option) => `<button class="choice" type="button" data-choice="${escapeAttribute(option)}">${escapeHtml(option)}</button>`).join("")}
        </div>
      `;
    }

    function checkAnswer(answer, target) {
      if (locked || !session[currentIndex]) return;
      locked = true;
      const word = session[currentIndex];
      const isCorrect = answersMatch(answer, target, mode === "choice");
      const feedback = document.querySelector("#feedback");
      state.answered += 1; sessionAnswered += 1;
      if (isCorrect) {
        state.correct += 1; sessionCorrect += 1;
        state.wrongIds = state.wrongIds.filter((id) => id !== wordId(word));
        feedback.className = "feedback good";
        feedback.innerHTML = `${escapeHtml(t("correct"))}<div class="answer-note">${escapeHtml(word.base)} → ${escapeHtml(word.past)} · ${escapeHtml(word.ing)} · ${escapeHtml(word.participle)}</div>`;
      } else {
        if (!state.wrongIds.includes(wordId(word))) state.wrongIds.push(wordId(word));
        feedback.className = "feedback bad";
        feedback.innerHTML = `${escapeHtml(t("wrong", target))}<div class="answer-note">${escapeHtml(word.base)} → ${escapeHtml(word.past)} · ${escapeHtml(word.ing)} · ${escapeHtml(word.participle)} · ${escapeHtml(word.meaning)}</div>`;
      }
      document.querySelectorAll("#checkBtn, [data-choice]").forEach((button) => button.disabled = true);
      saveState(); renderStats();
      const generation = sessionGeneration;
      advanceTimer = setTimeout(() => {
        if (generation !== sessionGeneration) return;
        advanceTimer = null; currentIndex += 1; locked = false; renderQuiz();
      }, isCorrect ? 900 : 1500);
    }

    function renderResult() {
      const wrongAvailable = getFilteredWords().some((word) => state.wrongIds.includes(wordId(word)) && (mode !== "meaning" || answerParts(word.meaning).length));
      const accuracy = sessionAnswered ? Math.round(sessionCorrect / sessionAnswered * 100) : 0;
      els.quizArea.innerHTML = `
        <div class="result">
          <h2>${escapeHtml(t("resultTitle"))}</h2>
          <p class="hint">${escapeHtml(t("resultSummary", sessionAnswered, accuracy))}</p>
          <div class="footer-actions">
            <button class="btn primary" id="againBtn" type="button">${escapeHtml(t("again", getQuestionCount()))}</button>
            <button class="btn ${wrongAvailable ? "" : "hidden"}" id="wrongOnlyBtn" type="button">${escapeHtml(t("wrongOnly"))}</button>
          </div>
        </div>`;
      document.querySelector("#againBtn").addEventListener("click", () => startSession());
      const wrongButton = document.querySelector("#wrongOnlyBtn");
      if (wrongButton) wrongButton.addEventListener("click", () => startSession(true));
    }

    function escapeHtml(text) {
      return String(text || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttribute(text) {
      return escapeHtml(text).replace(/`/g, "&#96;");
    }
  </script>

// Vocabulary has its own model and session state; it never changes the verb banks.
const vocabularyState = { mode:'selection', session:[], index:0, correct:0, wrong:[], submitted:false };
function vocabularyNormalize(value) { return String(value).trim().toLowerCase(); }
function vocabularyAccepts(question, value) {
  const answer=vocabularyNormalize(value);
  return [question.answer,...question.alternatives].some(candidate=>vocabularyNormalize(candidate)===answer);
}
function vocabularyShuffle(items) {
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy;
}
function vocabularyChoices(question) {
  const incorrect=vocabularyShuffle(vocabularyBank.filter(q=>!vocabularyAccepts(question,q.answer)));
  return vocabularyShuffle([question.answer,...incorrect.slice(0,3).map(q=>q.answer)]);
}
function leaveVocabulary() {
  document.querySelector('#vocabPage').classList.add('hidden');
  document.querySelector('#vocabNavBtn').classList.remove('primary');
  for(const id of ['adminNavBtn','exportScope','exportBtn','resetBtn']) document.getElementById(id).classList.remove('hidden');
  document.querySelector('.storage-note').classList.remove('hidden');
}
function showVocabulary() {
  document.querySelector('#practicePage').classList.add('hidden');
  document.querySelector('#adminPage').classList.add('hidden');
  document.querySelector('#practiceNavBtn').classList.remove('primary');
  document.querySelector('#vocabNavBtn').classList.add('primary');
  document.querySelector('#vocabPage').classList.remove('hidden');
  for(const id of ['adminNavBtn','exportScope','exportBtn','resetBtn']) document.getElementById(id).classList.add('hidden');
  document.querySelector('.storage-note').classList.add('hidden');
  if(!vocabularyState.session.length) startVocabulary();
}
function startVocabulary(retry=false) {
  const value=Number(document.querySelector('#vocabCount').value);
  const count=Number.isFinite(value)?Math.max(1,Math.min(32,Math.round(value))):32;
  document.querySelector('#vocabCount').value=count;
  const pool=retry?vocabularyBank.filter(q=>vocabularyState.wrong.includes(q.id)):vocabularyBank;
  vocabularyState.session=vocabularyShuffle(pool).slice(0,retry?pool.length:count);
  vocabularyState.index=0; vocabularyState.correct=0; vocabularyState.wrong=[]; vocabularyState.submitted=false;
  renderVocabulary();
}
function setVocabularyMode(mode) {
  vocabularyState.mode=mode;
  for(const [id,value] of [['vocabSelection','selection'],['vocabSpelling','spelling']]) {
    const active=value===mode; const button=document.getElementById(id);
    button.classList.toggle('primary',active); button.setAttribute('aria-pressed',String(active));
  }
  startVocabulary();
}
function renderVocabulary() {
  const area=document.querySelector('#vocabQuiz'); const s=vocabularyState;
  if(s.index>=s.session.length) {
    area.innerHTML=`<div class="result"><h3>Results · 練習結果</h3><p>Correct · 答對: <strong id="vocabCorrect">${s.correct}</strong> / ${s.session.length}</p><p>Incorrect · 答錯: <strong id="vocabIncorrect">${s.wrong.length}</strong></p><p>Accuracy: ${s.session.length?Math.round(s.correct/s.session.length*100):0}%</p><div class="footer-actions"><button class="btn primary" id="vocabAgain" type="button">Practice again · 再練習</button>${s.wrong.length?'<button class="btn" id="vocabRetry" type="button">Retry wrong answers · 錯題重練</button>':''}</div></div>`;
    document.querySelector('#vocabAgain').onclick=()=>startVocabulary();
    const retry=document.querySelector('#vocabRetry'); if(retry) retry.onclick=()=>startVocabulary(true);
    return;
  }
  s.submitted=false;
  const question=s.session[s.index];
  area.innerHTML=`<p class="question-label">Question · 題目 ${s.index+1} / ${s.session.length}</p><p>Correct · 答對 ${s.correct} · Incorrect · 答錯 ${s.wrong.length}</p><img class="vocab-picture" src="${question.image}" alt="Worksheet picture to identify" draggable="false">${s.mode==='selection'?'<div class="choice-grid" id="vocabChoices"></div>':'<form id="vocabForm"><label for="vocabAnswer">Type the English word · 請默寫英文詞語</label><div class="answer-row"><input id="vocabAnswer" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="English spelling" required><button class="btn primary" id="vocabSubmit" type="submit">Check · 提交</button></div></form>'}<div class="feedback" id="vocabFeedback" role="status"></div><button class="btn primary hidden" id="vocabNext" type="button">Next · 下一題</button>`;
  if(s.mode==='selection') {
    for(const word of vocabularyChoices(question)) {
      const button=document.createElement('button'); button.className='choice';button.type='button';button.textContent=word;
      button.onclick=()=>submitVocabulary(word,button);document.querySelector('#vocabChoices').append(button);
    }
  } else {
    document.querySelector('#vocabForm').onsubmit=event=>{event.preventDefault(); const input=document.querySelector('#vocabAnswer'); if(input.value.trim()) submitVocabulary(input.value);};
    document.querySelector('#vocabAnswer').focus();
  }
  document.querySelector('#vocabNext').onclick=()=>{s.index++; renderVocabulary();};
}
function submitVocabulary(value,selectedButton) {
  const s=vocabularyState; if(s.submitted) return; s.submitted=true;
  const question=s.session[s.index];const correct=vocabularyAccepts(question,value);
  if(correct) s.correct++; else s.wrong.push(question.id);
  const feedback=document.querySelector('#vocabFeedback');feedback.className='feedback '+(correct?'good':'bad');
  feedback.textContent=(correct?'Correct · 答對':'Incorrect · 答錯')+' — Correct spelling · 正確拼寫: '+question.answer;
  for(const button of document.querySelectorAll('#vocabChoices button')) {
    button.disabled=true;if(vocabularyAccepts(question,button.textContent)) button.classList.add('is-correct');
    else if(button===selectedButton) button.classList.add('is-wrong');
  }
  const input=document.querySelector('#vocabAnswer');if(input) {input.disabled=true;document.querySelector('#vocabSubmit').disabled=true;}
  const next=document.querySelector('#vocabNext');next.classList.remove('hidden');next.focus();
}
document.querySelector('#vocabNavBtn').onclick=showVocabulary;
document.querySelector('#vocabSelection').onclick=()=>setVocabularyMode('selection');
document.querySelector('#vocabSpelling').onclick=()=>setVocabularyMode('spelling');
document.querySelector('#vocabStart').onclick=()=>startVocabulary();

</script>
